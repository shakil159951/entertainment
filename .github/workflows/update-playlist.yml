name: Auto Update VOD Playlist

on:
  schedule:
    # প্রতি ২৪ ঘণ্টায় একবার চলবে (02:00 UTC = সকাল 08:00 AM BDT)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run playlist generator
        run: python playlist.py

      - name: Commit and push updated playlist.m3u
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u
          if git diff --staged --quiet; then
            echo "No changes in playlist.m3u"
          else
            git commit -m "chore: update playlist.m3u ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
